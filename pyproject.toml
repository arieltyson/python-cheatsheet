[project]
name = "python-cheatsheet"
version = "1.0.0"
description = "A single-page Python reference for coding interviews."
readme = "README.md"
license = "MIT"
# The build tooling needs 3.12+ (tokenize f-string tokens). The snippets
# themselves only use syntax that runs on Python 3.10+.
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 72
target-version = "py310"
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
# tomllib is 3.11+ standard library; only the 3.12+ tooling imports it.
extra-standard-library = ["tomllib"]
