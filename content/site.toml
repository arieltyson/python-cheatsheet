code = ["syntax/builtins.py:demo_sorting"]
gotcha = "`list.sort()` returns `None`. Writing `items = items.sort()` loses the list."

[[part.section.entry]]
id = "sort-keys"
title = "Sort by several keys"
aliases = ["multi key sort", "descending", "tie break", "lambda", "custom sort"]
code = ["syntax/builtins.py:demo_sort_keys"]
use_when = "Sort descending on one field and ascending on another: negate the numeric field in a tuple key."
gotcha = "Python's sort is stable and costs O(n log n). There is no `cmp=`; use `key=`."

